openapi: 3.1.0
info:
  title: Xiaoshang New Media Workbench Local API
  version: 0.6.0
  description: PHASE 6 local API. SQLite is the sole business source. Timestamps use UTC ISO8601; metric periods are inclusive Shanghai calendar dates. No business fixtures are created at startup. All API calls with an explicit invalid Bearer token are rejected. New calls during restore receive 503.
servers:
  - url: http://127.0.0.1:5173/api/v1
paths:
  /reports:
    get:
      operationId: listReports
      description: 保存后的完整快照；不会动态关联后来数据。
      parameters:
        - name: periodType
          in: query
          required: false
          schema:
            type: string
            enum:
              - week
              - month
      responses:
        "200":
          description: 保存后的完整快照；不会动态关联后来数据。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/ReportList"
                  meta:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, OBSERVATION_NOT_PENDING, OBSERVATION_ALREADY_CONVERTED,
            RESTORE_CONFIRMATION_INVALID or OPERATION_UNCERTAIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: MAINTENANCE or REQUEST_DRAIN_TIMEOUT. Retry after active recovery completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createReport
      description: 确定性周/月报告；同键重放同 ID，不同键同周期保存独立不可变快照。未调用 AI。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 确定性周/月报告；同键重放同 ID，不同键同周期保存独立不可变快照。未调用 AI。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/Report"
                  meta:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, OBSERVATION_NOT_PENDING, OBSERVATION_ALREADY_CONVERTED,
            RESTORE_CONFIRMATION_INVALID or OPERATION_UNCERTAIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: MAINTENANCE or REQUEST_DRAIN_TIMEOUT. Retry after active recovery completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security:
        - bearerAuth: []
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
  /reports/preview:
    get:
      operationId: previewReport
      description: 不保存预览。上海时间，周一至周日或自然月；已发布内容按实际 published_at 去重。指标采用安全周期汇总，排除跨边界、重叠与推断值，未知保留 null。
      parameters:
        - name: periodType
          in: query
          required: true
          schema:
            type: string
            enum:
              - week
              - month
        - name: anchorDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 不保存预览。上海时间，周一至周日或自然月；已发布内容按实际 published_at 去重。指标采用安全周期汇总，排除跨边界、重叠与推断值，未知保留 null。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/Report"
                  meta:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, OBSERVATION_NOT_PENDING, OBSERVATION_ALREADY_CONVERTED,
