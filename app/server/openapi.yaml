            schema:
              $ref: "#/components/schemas/IngestionInput"
      responses:
        "201":
          description: Persisted run or idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: "IDEMPOTENCY_KEY_REUSED: same key used with a different request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request exceeds configured body limit
  /ingestion/mapping:
