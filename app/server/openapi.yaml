  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      description: Shanghai monthly summary. Latest exact entity/period by capturedAt then import order; widest
        non-overlapping intervals. Cross-month ranges excluded without prorating. Prefer account scope per
        platform, otherwise known publication subtotal. Missing values stay null, inferred metrics excluded; net
        followers derive only from paired factual inputs in one snapshot. Ranking sums content across platforms.
        Trends contain selected single-day observations only and explicit derived evidence; no fabricated daily
        deltas. contentCount uses created_at in Shanghai month. Warnings/calculationNote are Chinese
        user-readable.
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}$
          description: YYYY-MM, defaults to current Shanghai month.
      responses:
        "200":
          description: Shanghai monthly summary. Latest exact entity/period by capturedAt then import order; widest
            non-overlapping intervals. Cross-month ranges excluded without prorating. Prefer account scope per
            platform, otherwise known publication subtotal. Missing values stay null, inferred metrics excluded;
            net followers derive only from paired factual inputs in one snapshot. Ranking sums content across
            platforms. Trends contain selected single-day observations only and explicit derived evidence; no
            fabricated daily deltas. contentCount uses created_at in Shanghai month. Warnings/calculationNote
            are Chinese user-readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
  /contents/{id}/review:
