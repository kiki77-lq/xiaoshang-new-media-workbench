components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: local-token
      description: Token stored only in project-root data/secrets.json.
    sameOrigin:
      type: apiKey
      in: header
      name: Origin
      description: Browser writes are accepted only when Origin matches the local service origin.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Ordinary business POST responses replay with the same key and body for 24 hours. After expiry or uncertain request time, query existing state before retrying; an expired key can create again. Backup/restore use persistent external receipts instead. PATCH uses version conflicts, not POST-style replay.
  schemas:
    ReportInput:
      type: object
      additionalProperties: false
      required:
        - periodType
      properties:
        periodType:
          type: string
          enum:
            - week
            - month
        anchorDate:
          type: string
          format: date
        generationMode:
          type: string
          enum:
            - deterministic
          default: deterministic
    ReportSummary:
      type: object
      additionalProperties: false
      required:
        - newInspirations
        - newContents
        - publishedContents
        - views
        - topContents
        - platforms
        - observations
        - insights
        - recommendations
        - dataGaps
      properties:
        newInspirations:
          type: integer
        newContents:
          type: integer
        publishedContents:
          type: integer
        views:
          type:
            - number
            - "null"
        topContents:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - contentId
              - title
              - views
            properties:
              contentId:
                type: string
              title:
                type: string
              views:
                type: number
        platforms:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - name
              - views
              - netFollowers
            properties:
              code:
                type: string
              name:
                type: string
              views:
                type:
                  - number
                  - "null"
              netFollowers:
                type:
                  - number
                  - "null"
        observations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - title
              - kind
              - status
            properties:
              id:
                type: string
              title:
                type: string
              kind:
                type: string
              status:
                type: string
        insights:
          type: array
          items:
            type: string
        recommendations:
          type: array
