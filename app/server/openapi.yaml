  /contents/{id}/publications/{platformCode}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: platformCode
        in: path
        required: true
        schema: { type: string, enum: [douyin, wechat_channels, xiaohongshu, weibo] }
    patch:
      operationId: updatePublication
      summary: Update one of a content's four platform publications
      description: >-
        Forward status jumps are permitted; backward transitions require a nonblank reason recorded in audit.
        scheduled requires scheduledAt; published requires publishedAt. Supplying a schedule without a status
        sets scheduled. Clearing a schedule restores scheduled to ready and requires a reason.
        A backward transition below scheduled clears an unpublished schedule. Calendar and publication updates,
        affected versions and audit are atomic. A second active publish event is rejected.
        Recorded publishedAt and scheduledAt are immutable once published; history remains protected after
        a reasoned backward status transition. Invalid dates, timezone-less timestamps and non-HTTP(S) URLs are rejected.
        A reschedule that would put startsAt after an existing endsAt is rejected; edit both times via the calendar API.
      security: [{ bearerAuth: [] }, { sameOrigin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePublicationInput' }
      responses:
        '200':
          description: Updated publication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationEnvelope' }
        '400': { $ref: '#/components/responses/SchedulingValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SchedulingConflict' }
  /calendar-events:
    get:
      operationId: listCalendarEvents
      summary: Read events whose start is in an explicit half-open date range
      description: from is inclusive; to is exclusive. Both require valid ISO8601 timestamps with an explicit timezone. Cancelled and completed records remain visible with their status.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: eventType
          in: query
          schema: { $ref: '#/components/schemas/CalendarEventType' }
      responses:
        '200':
          description: All events in the bounded range, ordered by startsAt then id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarListEnvelope' }
        '400': { $ref: '#/components/responses/SchedulingValidationError' }
        '403': { $ref: '#/components/responses/HostForbidden' }
    post:
      operationId: createCalendarEvent
      summary: Create a shoot, publish or pending confirmation event
      description: >-
        Publish requires publicationId; contentId is derived from it and must match if supplied.
        Non-publish events cannot carry publicationId. A publish event must initially be planned or confirmed;
        creating it atomically sets the publication to scheduled and scheduledAt to startsAt.
        The same Idempotency-Key replays the original response; another key cannot duplicate an active publication schedule.
      security: [{ bearerAuth: [] }, { sameOrigin: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCalendarEventInput' }
      responses:
        '201':
          description: Created event or idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEventEnvelope' }
        '400': { $ref: '#/components/responses/SchedulingValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SchedulingConflict' }
  /calendar-events/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      operationId: updateCalendarEvent
      summary: Edit event details and synchronize publication scheduling atomically
      description: >-
        Event type and content/publication links are immutable. endsAt must be null or at/after startsAt.
        A linked publication version also advances. Cancelling an unpublished schedule clears scheduledAt and
        restores scheduled to ready, requiring reason. Completed publish events can only be produced by recording
        publishedAt via the publication API. Previously published events cannot be edited or cancelled.
      security: [{ bearerAuth: [] }, { sameOrigin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCalendarEventInput' }
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEventEnvelope' }
        '400': { $ref: '#/components/responses/SchedulingValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SchedulingConflict' }
    delete:
      operationId: deleteCalendarEvent
      summary: Delete an event with a checked version and audit entry
      description: >-
        JSON body version is mandatory. When deleting the last unpublished active publish schedule,
        clear scheduledAt and restore scheduled to ready atomically. That backward transition requires reason.
        Deleting an old cancelled event does not clear a newer active schedule. Published history cannot be deleted.
      security: [{ bearerAuth: [] }, { sameOrigin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteCalendarEventInput' }
      responses:
        '200':
          description: Deleted event receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarDeleteEnvelope' }
        '400': { $ref: '#/components/responses/SchedulingValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SchedulingConflict' }
