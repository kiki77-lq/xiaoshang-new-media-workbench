    CalendarEvent:
      type: object
      required: [id, contentId, publicationId, eventType, status, title, startsAt, endsAt, notes, createdAt, updatedAt, version, platformCode, platformName]
      properties:
        id: { type: string }
        contentId: { type: [string, 'null'] }
        publicationId: { type: [string, 'null'] }
        eventType: { $ref: '#/components/schemas/CalendarEventType' }
        status: { $ref: '#/components/schemas/CalendarEventStatus' }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        platformCode: { type: [string, 'null'], enum: [douyin, wechat_channels, xiaohongshu, weibo, null] }
        platformName: { type: [string, 'null'] }
    PublicationEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Publication' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CalendarEventEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CalendarEvent' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CalendarListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, total]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
            total: { type: integer, minimum: 0 }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CalendarDeleteEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, deleted]
          properties:
            id: { type: string }
            deleted: { const: true }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    RequestMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
        idempotencyReplayed:
          type: boolean
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/RequestMeta"
    InspirationEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Inspiration"
        meta:
          $ref: "#/components/schemas/RequestMeta"
    InspirationListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Inspiration"
            total:
              type: integer
              minimum: 0
        meta:
          $ref: "#/components/schemas/RequestMeta"
    ContentEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Content"
        meta:
          $ref: "#/components/schemas/RequestMeta"
    ContentListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Content"
            total:
              type: integer
              minimum: 0
        meta:
          $ref: "#/components/schemas/RequestMeta"
    ConversionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [content, inspiration, alreadyConverted]
          properties:
            content:
              $ref: "#/components/schemas/Content"
            inspiration:
              $ref: "#/components/schemas/Inspiration"
            alreadyConverted:
              type: boolean
        meta:
          $ref: "#/components/schemas/RequestMeta"
    DashboardEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Dashboard"
        meta:
          $ref: "#/components/schemas/RequestMeta"
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
        requestId:
          type: string
          format: uuid
    InspirationStatus:
      type: string
      enum: [inbox, organized, converted, archived]
    ContentType:
      type: string
      enum: [organic, commercial]
    ContentStatus:
      type: string
      enum: [preparing, producing, ready, published]
    PublicationStatus:
      type: string
      enum: [not_started, preparing, producing, ready, scheduled, published]
    Inspiration:
      type: object
      required: [id, rawText, summaryTitle, isFallbackTitle, pinned, status, tags, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        rawText: { type: string }
        summaryTitle: { type: string }
        isFallbackTitle: { type: boolean }
        brand: { type: [string, "null"] }
        vehicleModel: { type: [string, "null"] }
        sourceType:
          type: string
          enum: [wechat, workbuddy, manual, hotspot, other]
        sourcePlatform: { type: [string, "null"] }
        sourceUrl: { type: [string, "null"], format: uri }
        pinned: { type: boolean }
        status:
          $ref: "#/components/schemas/InspirationStatus"
        convertedContentId: { type: [string, "null"] }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CreateInspirationInput:
      type: object
      required: [rawText]
      additionalProperties: false
      properties:
        rawText: { type: string, minLength: 1 }
        summaryTitle: { type: string }
        brand: { type: string }
        vehicleModel: { type: string }
        sourceType: { type: string, enum: [wechat, workbuddy, manual, hotspot, other] }
        sourcePlatform: { type: string }
        sourceUrl: { type: string, format: uri }
        pinned: { type: boolean }
        tags:
          type: array
          items: { type: string }
    UpdateInspirationInput:
      type: object
      required: [version]
      description: rawText is deliberately absent and rejected by the API.
      additionalProperties: false
      properties:
        summaryTitle: { type: string }
        brand: { type: string }
        vehicleModel: { type: string }
        sourcePlatform: { type: string }
        sourceUrl: { type: string, format: uri }
        pinned: { type: boolean }
        status:
          $ref: "#/components/schemas/InspirationStatus"
        tags:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }
    ConvertInspirationInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        contentType:
          $ref: "#/components/schemas/ContentType"
        status:
          $ref: "#/components/schemas/ContentStatus"
        brand: { type: string }
        vehicleModel: { type: string }
        summary: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }
    Publication:
      type: object
      required: [id, platformCode, platformName, status, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        contentId: { type: string, description: Included by the publication update endpoint. }
        contentTitle: { type: string, description: Included by the publication update endpoint. }
        platformCode: { type: string, enum: [douyin, wechat_channels, xiaohongshu, weibo] }
        platformName: { type: string }
        status:
          $ref: "#/components/schemas/PublicationStatus"
        scheduledAt: { type: [string, "null"], format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        platformContentId: { type: [string, "null"] }
        publishedUrl: { type: [string, "null"], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    Content:
      type: object
      required: [id, title, contentType, status, tags, publications, sourceInspirationIds, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        title: { type: string }
        contentType:
          $ref: "#/components/schemas/ContentType"
        status:
          $ref: "#/components/schemas/ContentStatus"
        brand: { type: [string, "null"] }
        vehicleModel: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        tags:
          type: array
          items: { type: string }
        publications:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Publication"
        sourceInspirationIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CreateContentInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        contentType:
          $ref: "#/components/schemas/ContentType"
        status:
          $ref: "#/components/schemas/ContentStatus"
        brand: { type: string }
        vehicleModel: { type: string }
        summary: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
    UpdateContentInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        title: { type: string }
        contentType:
          $ref: "#/components/schemas/ContentType"
        status:
          $ref: "#/components/schemas/ContentStatus"
        brand: { type: string }
        vehicleModel: { type: string }
        summary: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }
    Dashboard:
      type: object
      required: [monthContentCount, producingCount, todayPublishCount, needsAttentionCount, platforms, recentContents, hotspotSummary, competitorSummary]
      properties:
        monthContentCount: { type: integer, minimum: 0 }
        producingCount: { type: integer, minimum: 0 }
        todayPublishCount: { type: integer, minimum: 0, description: Planned/confirmed publish events today in Asia/Shanghai whose publication is scheduled. }
        needsAttentionCount: { type: integer, minimum: 0, description: Pending confirmation events that are planned or confirmed and not completed/cancelled. }
        platforms:
          type: array
          items:
            type: object
            required: [code, displayName, enabled]
            properties:
              code: { type: string }
              displayName: { type: string }
              enabled: { type: boolean }
        recentContents:
          type: array
          items:
            $ref: "#/components/schemas/Content"
        hotspotSummary:
          type: array
          maxItems: 3
          description: Up to three pending observations with kind=hotspot ordered by manual heat score then discovery time.
          items:
            $ref: "#/components/schemas/DashboardObservationSummary"
        competitorSummary:
          type: array
          maxItems: 3
          description: Up to three pending observations with kind=competitor ordered by discovery time, newest first.
          items:
            $ref: "#/components/schemas/DashboardObservationSummary"
    DashboardObservationSummary:
      type: object
      required: [id, title, kind]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [hotspot, competitor] }
        heatScore: { type: [number, "null"], description: Manual 0-100 score, null when unset. }
        worthReason: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        competitorName: { type: [string, "null"] }
        sourcePlatform: { type: [string, "null"] }
        sourceUrl: { type: [string, "null"] }
        discoveredAt: { type: string, format: date-time }
        tags: { type: array, items: { type: string } }
  responses:
    SchedulingValidationError:
      description: 'VALIDATION_ERROR, VERSION_REQUIRED, REASON_REQUIRED, PUBLICATION_REQUIRED or IDEMPOTENCY_KEY_REQUIRED. Body fields, enums, positive integer versions, URLs, timestamps and endsAt are validated.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SchedulingConflict:
      description: 'VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, PUBLICATION_ALREADY_SCHEDULED or PUBLISHED_HISTORY_PROTECTED. No partial writes survive.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request validation failed or immutable rawText was supplied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OriginForbidden:
      description: Browser write Origin is not same-origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VersionConflict:
      description: version is stale; error.code is VERSION_CONFLICT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConversionConflict:
      description: version is stale or Idempotency-Key was reused with different input; error.code identifies the case
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    HostForbidden:
      description: Host does not match an allowed local application origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: Idempotency-Key was reused with a different request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: JSON body exceeds WORKBENCH_BODY_LIMIT_BYTES (2 MB by default)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
