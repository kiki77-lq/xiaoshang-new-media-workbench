      description: Account observation when contentId omitted/null. Content must already exist and have the platform
        publication. At least one metric, series point or review required. No duplicate flat/nested metric key.
        Explicit null enums/dates rejected.
    IngestionDefaults:
      type: object
      additionalProperties: false
      required: []
      properties:
        platformCode:
          type: string
          enum:
            - douyin
            - wechat_channels
            - xiaohongshu
            - weibo
        contentId:
          type:
            - string
            - "null"
          maxLength: 240
      description: CSV/Excel only. Fill missing/blank platformCode/contentId cells. Explicit nonblank row cells
        override defaults; omit contentId for account data.
    IngestionInput:
      type: object
      additionalProperties: false
      required:
        - sourceType
        - sourceName
        - periodStart
        - periodEnd
      properties:
        sourceType:
          type: string
          enum:
            - manual
            - csv
            - excel
            - workbuddy
        sourceName:
          type: string
          minLength: 1
          maxLength: 240
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        mapping:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            enum:
              - platformCode
              - contentId
              - sourceReference
              - capturedAt
              - notes
              - periodStart
              - periodEnd
              - metrics
              - series
              - review
              - views
              - likes
              - comments
              - shares
              - saves
              - followers_total
              - followers_gained
              - followers_lost
              - net_followers
              - completion_rate
              - two_second_bounce_rate
              - five_second_retention_rate
              - average_watch_seconds
          description: Header to canonical row field; overrides default Chinese/English mapping. Unknown or duplicate
            mapped columns reject the parse.
        defaults:
          $ref: "#/components/schemas/IngestionDefaults"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/IngestionRow"
          maxItems: 1000
          minItems: 1
        csvText:
          type: string
          minLength: 1
          maxLength: 1048576
        fileBase64:
          type: string
          minLength: 1
          maxLength: 1398104
          contentEncoding: base64
      oneOf:
        - properties:
            sourceType:
              enum:
                - manual
                - workbuddy
          required:
            - rows
          not:
            anyOf:
              - required:
                  - csvText
              - required:
                  - fileBase64
              - required:
                  - mapping
              - required:
                  - defaults
        - properties:
            sourceType:
              const: csv
          required:
            - csvText
          not:
            anyOf:
              - required:
                  - rows
              - required:
                  - fileBase64
        - properties:
            sourceType:
              const: excel
          required:
            - fileBase64
          not:
            anyOf:
              - required:
                  - rows
              - required:
                  - csvText
      description: Inclusive Shanghai dates, valid 1900..9998; start <= end. official_api reserved but unavailable.
        1 MiB CSV or decoded Excel; request-body default 2 MiB. XLSX and XLS, first sheet only; 1000 data rows, 64
        columns, 64064 cells, 16 MiB expanded ZIP and 256 entries. Formula/error cells rejected per row. CSV/Excel
        metrics/series/review cells may contain JSON strings. Structural parse failure persists failed run with
        row=0; row validation failure rolls back only its row.
