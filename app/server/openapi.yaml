  /backups/{id}/verify:
    post:
      operationId: verifyBackup
      description: 校验哈希、临时副本完整性、已知 schema 与必要表；兼容旧库仅迁移临时副本。发放绑定 ID+SHA256 的单次五分钟进程内确认票据。
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: 校验哈希、临时副本完整性、已知 schema 与必要表；兼容旧库仅迁移临时副本。发放绑定 ID+SHA256 的单次五分钟进程内确认票据。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/BackupVerification"
                  meta:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, OBSERVATION_NOT_PENDING, OBSERVATION_ALREADY_CONVERTED,
            RESTORE_CONFIRMATION_INVALID or OPERATION_UNCERTAIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: MAINTENANCE or REQUEST_DRAIN_TIMEOUT. Retry after active recovery completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security:
        - bearerAuth: []
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyInput"
  /backups/{id}/restore:
    post:
      operationId: restoreBackup
      description: 显式第二次确认。票据一次性使用；再次验哈希、拒绝新请求并排空在途异步工作，校验暂存副本，创建并验证保护备份后原子替换。全部路由重新绑定原生
        DB；健康/审计失败回滚并重新打开旧数据库。异步操作日志在数据库外，不跨替换持有 SQLite 事务。相同键可重放成功结果；进程中断的 pending 日志返回 OPERATION_UNCERTAIN。
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 显式第二次确认。票据一次性使用；再次验哈希、拒绝新请求并排空在途异步工作，校验暂存副本，创建并验证保护备份后原子替换。全部路由重新绑定原生
            DB；健康/审计失败回滚并重新打开旧数据库。异步操作日志在数据库外，不跨替换持有 SQLite 事务。相同键可重放成功结果；进程中断的 pending 日志返回
            OPERATION_UNCERTAIN。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/RestoreResult"
                  meta:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, OBSERVATION_NOT_PENDING, OBSERVATION_ALREADY_CONVERTED,
            RESTORE_CONFIRMATION_INVALID or OPERATION_UNCERTAIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "RESTORE_FAILED: recovery failed; previous data was protected by rollback where possible. Inspect
            /health before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: MAINTENANCE or REQUEST_DRAIN_TIMEOUT. Retry after active recovery completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security:
        - bearerAuth: []
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreInput"
  /ingestion:
    get:
      operationId: listIngestionRuns
      description: Latest 100 persisted runs, newest first. Parse failures have row=0 and no parsed rows; row errors
        use one-based record positions (tabular header counts as row 1).
      parameters: []
      responses:
        "200":
          description: Latest 100 persisted runs, newest first. Parse failures have row=0 and no parsed rows; row errors
            use one-based record positions (tabular header counts as row 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionListEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createIngestion
      summary: Import manual, CSV, Excel or WorkBuddy-compatible observations
      description: Synchronous idempotency transaction with per-row savepoints. Successful rows survive other row
        errors; any overall transaction/audit failure rolls everything back. All valid import envelopes return
        201 including persisted failed/partial_failure runs; invalid envelope returns 400. Same key/body
        replays; changed body conflicts.
      security:
        - bearerAuth: []
        - sameOrigin: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
