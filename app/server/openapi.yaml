      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          oneOf:
            - type: number
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: string
              maxLength: 100
          description: Counts exact integers (negative only net_followers); ratios 0..1 or percent strings; seconds >=0.
            Grouped comma, 万, 亿 display values accepted for counts. Null/blank scalar metrics omitted.
        evidenceLevel:
          type: string
          enum:
            - observed
            - derived
            - inferred
          default: observed
        calculationNote:
          type:
            - string
            - "null"
          maxLength: 5000
        evidence:
          oneOf:
            - type: "null"
            - type: string
              minLength: 1
              maxLength: 20000
            - type: number
            - type: array
              minItems: 1
            - type: object
              minProperties: 1
          description: Nonempty JSON references/values, serialized max 20000 characters; no nested empty values.
            Derived/inferred require non-null evidence.
      allOf:
        - if:
            required:
              - evidenceLevel
            properties:
              evidenceLevel:
                enum:
                  - derived
                  - inferred
          then:
            required:
              - calculationNote
              - evidence
            properties:
              calculationNote:
                type: string
                minLength: 1
                maxLength: 5000
              evidence:
                not:
                  type: "null"
